services:
  pg-telegram-backup:
    build: .
    container_name: pg-telegram-backup
    restart: unless-stopped
    # Optional: override schedule without editing .env
    # environment:
    #   CRON_SCHEDULE: "0 2 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env:ro
